name: OCI Sigstore final macOS acceptance on hosted runner

on:
  push:
    branches: [ci/oci-sigstore-macos-acceptance]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  acceptance-macos14:
    name: "Acceptance tests (Mac, isolated)"
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checkout exact implementation tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          bootstrap-apt-packages: ""
          go-dependencies: false
          download-test-fixture-cache: true
      - name: Download snapshot artifacts from successful final build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: snapshot
          run-id: 39677733862
          github-token: ${{ github.token }}
      - name: Restore binary permissions
        run: chmod +x snapshot/*/syft 2>/dev/null || true
      - name: Run original Syft macOS comparison tests
        run: make compare-mac
      - name: Run original Syft macOS installation acceptance tests
        run: make install-test-ci-mac
