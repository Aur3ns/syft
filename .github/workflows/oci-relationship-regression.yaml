name: OCI relationship isolation regression (fork only)

on:
  push:
    branches: [fix/oci-relationship-isolation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolated-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting
        run: |
          gofmt -w syft/ociattestation
          gofmt -w cmd/syft/internal/commands/scan_oci_attestations.go
          gofmt -w cmd/syft/internal/commands/scan_oci_attestations_test.go
          test -z "$(gofmt -l syft/ociattestation)"
          test -z "$(gofmt -l cmd/syft/internal/commands/scan_oci_attestations.go)"
          test -z "$(gofmt -l cmd/syft/internal/commands/scan_oci_attestations_test.go)"
      - name: Tests and race detector
        run: go test -race ./syft/ociattestation ./cmd/syft/internal/commands -run 'Test(Combine|ProduceScanSBOM|Discover|DecodeSBOMs|NewClientForImage)' -count=1
      - name: Static analysis
        run: go vet ./syft/ociattestation ./cmd/syft/internal/commands
      - name: Syft official static analysis
        run: make static-analysis
      - name: Commit formatting to isolated fork branch
        run: |
          git add syft/ociattestation cmd/syft/internal/commands/scan_oci_attestations.go cmd/syft/internal/commands/scan_oci_attestations_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "style(oci): gofmt authenticated-registry regression tests"
            git push origin HEAD:refs/heads/fix/oci-relationship-isolation
          fi

