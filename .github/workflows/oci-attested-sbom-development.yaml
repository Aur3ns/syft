name: OCI attested SBOM development checks

on:
  push:
    branches:
      - feat/oci-attested-sbom-ingestion
  workflow_dispatch:

permissions: {}

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format OCI Go package
        run: gofmt -w syft/ociattestation
      - name: Focused unit tests
        run: go test ./syft/ociattestation -count=1
      - name: Focused race tests
        run: go test -race ./syft/ociattestation -count=1
      - name: Static checks
        run: go vet ./syft/ociattestation
      - name: Compile Syft CLI and integration
        run: go test ./cmd/syft/internal/commands -run '^      - name: Check formatting
        run: test -z "$(gofmt -l syft/ociattestation)"
      - name: Commit formatting to fork-only development branch
        if: github.repository == 'Aur3ns/syft' && github.ref == 'refs/heads/feat/oci-attested-sbom-ingestion'
        run: |
          git add syft/ociattestation
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "style(oci): gofmt discovery and decoder"
            git fetch origin feat/oci-attested-sbom-ingestion
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/feat/oci-attested-sbom-ingestion)" ]; then
              echo "A newer commit exists; leave formatting to the current branch's validation."
              exit 0
            fi
            git push origin HEAD:refs/heads/feat/oci-attested-sbom-ingestion
          fi
